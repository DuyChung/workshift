version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: workshift_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: workshift
      POSTGRES_PASSWORD: workshift123
      POSTGRES_DB: workshift_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workshift']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workshift_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://workshift:workshift123@postgres:5432/workshift_db
      JWT_SECRET: change_me_in_production_super_secret
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workshift_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
